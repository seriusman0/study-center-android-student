appId: com.studycenter.sc_student
---
# ─── LAUNCH ─────────────────────────────────────────────────────────────────────
- launchApp:
    clearState: true

# ─── LOGIN ────────────────────────────
- extendedWaitUntil:
    visible: "Masuk"
    timeout: 15000
- assertVisible: "Masuk ke akun Study Center Nias"

# Input fields
- tapOn: "email@contoh.com / username"
- inputText: "teststudent"
- pressKey: Enter
- inputText: "12345"
- tapOn: "Password"
- tapOn:
    id: "loginBtn"

# ─── BERANDA ───────────────────────────────────────────────────────────────────
- extendedWaitUntil:
    visible: ".*Jurnal Hari Ini.*"
    timeout: 20000

# ─── NAVIGASI KE JURNAL ────────────────────────────────────────────────────────
- tapOn: "Jurnal.*"

- extendedWaitUntil:
    visible: ".*Baca Alkitab.*"
    timeout: 20000

# ─── PENGISIAN JURNAL HARI INI ────────────────────────────────────────────────────────
- tapOn: "Perjanjian Lama"
- waitForAnimationToEnd:
    timeout: 2000

- tapOn: "Perjanjian Baru"
- waitForAnimationToEnd:
    timeout: 2000

# ─── AYAT HAFALAN ────────────────────────────────────────────────────────
- scrollUntilVisible:
    element:
      text: "Hafal Ayat"
    direction: DOWN

- tapOn: "Pilih Kitab"
- tapOn: "Yohanes"
- tapOn: "Pasal"
- inputText: "3"
- tapOn: ".*Hafal Ayat.*"
- tapOn:
    id: "ayatInput"
- inputText: "16"
- tapOn: ".*Hafal Ayat.*"
- tapOn: ".*Simpan.*"
- waitForAnimationToEnd:
    timeout: 2000

# ─── FOTO BELAJAR ────────────────────────────────────────────────────────
- scrollUntilVisible:
    element:
      text: ".*Upload Foto.*"
    direction: DOWN
- tapOn: ".*Upload Foto.*"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    text: ".*Allow.*"
    optional: true
- tapOn:
    text: ".*Izinkan.*"
    optional: true
- tapOn:
    text: ".*While using the app.*"
    optional: true
- tapOn:
    text: ".*Saat aplikasi digunakan.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: "before_photo_picker"
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    point: "20%, 30%" # Usually the first item in the grid
- takeScreenshot: "after_photo_picker"
- extendedWaitUntil:
    visible: ".*Ganti Foto.*"
    timeout: 20000
