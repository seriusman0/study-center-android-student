appId: com.studycenter.sc_student
---
# ─── LAUNCH ─────────────────────────────────────────────────────────────────────
- stopApp
- launchApp:
    clearState: false

# ─── BERANDA ───────────────────────────────────────────────────────────────────
- extendedWaitUntil:
    visible: ".*Jurnal Hari Ini.*"
    timeout: 20000

# ─── NAVIGASI KE JURNAL ────────────────────────────────────────────────────────
- tapOn: "Jurnal Hari Ini"

- extendedWaitUntil:
    visible: ".*Baca Alkitab.*"
    timeout: 20000

# ─── PENGISIAN JURNAL HARI INI ────────────────────────────────────────────────────────
- tapOn: "Perjanjian Lama"
- waitForAnimationToEnd:
    timeout: 2000

- tapOn: "Perjanjian Baru"
- waitForAnimationToEnd:
    timeout: 2000

# ─── AYAT HAFALAN ────────────────────────────────────────────────────────
- scrollUntilVisible:
    element:
      text: ".*Hafal Ayat.*"
    direction: DOWN

- tapOn: ".*Kitab.*"
- inputText: "Yohanes"
- tapOn: ".*Hafal Ayat.*"
- tapOn:
    id: "pasalInput"
- inputText: "3"
- tapOn: ".*Hafal Ayat.*"
- tapOn:
    id: "ayatInput"
- inputText: "16"
- tapOn: ".*Hafal Ayat.*"
- tapOn: ".*Simpan.*"
- waitForAnimationToEnd:
    timeout: 2000

# ─── FOTO BELAJAR ────────────────────────────────────────────────────────
- scrollUntilVisible:
    element:
      text: ".*Upload Foto.*"
    direction: DOWN
- tapOn: ".*Upload Foto.*"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    text: ".*Allow.*"
    optional: true
- tapOn:
    text: ".*Izinkan.*"
    optional: true
- tapOn:
    text: ".*While using the app.*"
    optional: true
- tapOn:
    text: ".*Saat aplikasi digunakan.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    point: "30%, 30%"
- extendedWaitUntil:
    visible: ".*Ganti Foto.*"
    timeout: 20000
