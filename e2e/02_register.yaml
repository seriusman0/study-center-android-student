# ---- Validate that a new guest user cannot access student features ----
# After registration via API, user has role=guest (not student).
# Login with guest credentials should succeed but student-only tabs
# should show Forbidden if the app enforces role checking.
#
# For now, confirm login screen is intact.
- assertVisible: "Masuk"
