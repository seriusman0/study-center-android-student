appId: com.studycenter.sc_student
---
# Flow 02: Registration flow
# Covers: POST /api/auth/register
#
# Note: The current app only has a login screen visible in the student app.
# Registration may be done via the web portal or a register screen if added.
# This flow tests the login screen navigation and documents the expected
# registration API behaviour for future screen implementation.
#
# If a register button/link exists on the login screen, this flow exercises it.
# Otherwise it validates the login screen as the entry point.

- launchApp:
    clearState: true

- assertVisible: "Masuk"
- assertVisible: "Email"
- assertVisible: "Password"

- takeScreenshot: "02_register_login_screen"

# ---- If a "Daftar" / "Register" link exists, tap it ----
