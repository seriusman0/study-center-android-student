appId: com.studycenter.sc_student
---
# Flow 15: Role-aware navigation — college sees minimal tabs.

- launchApp:
    clearState: true

- assertVisible: "Masuk"
- tapOn: "email@contoh.com / username"
- eraseText
- waitForAnimationToEnd:
    timeout: 500
- inputText: "test_college@studycenter.test"
- tapOn: "Masukkan password"
- eraseText
- waitForAnimationToEnd:
    timeout: 500
- inputText: "Test12345"
- hideKeyboard
- tapOn: "Login Sekarang"

- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: "Test College"
    timeout: 15000
- takeScreenshot: "15_college_home"

- assertVisible: "Beranda"
- assertVisible: "Profil"

- takeScreenshot: "15_college_bottom_nav"

- tapOn:
    point: "630,1433"
- waitForAnimationToEnd
- assertVisible: "Keluar"
- takeScreenshot: "15_college_profil_tab"
