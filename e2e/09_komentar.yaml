# Flow 09: Komentar — read comments, post a comment, delete own comment
# Covers: GET /api/blogs/{blog}/comments, POST /api/blogs/{blog}/comments,
#         DELETE /api/comments/{comment}
#
# Comments are attached to blog posts. This flow assumes:
# - Blog detail screen exists and is accessible by tapping a blog card
# - Comment section is visible on the blog detail screen
# - A text field allows posting a comment

- launchApp:
    clearState: true

# ---- Login ----
- assertVisible: "Masuk"
- tapOn: "Email"
- clearText
- inputText: "test@studycenter.test"
- tapOn: "Password"
- clearText
- inputText: "password123"
- tapOn:
    text: "Masuk"
    index: 0

- assertVisible: "Beranda"

# ---- Navigate to Beranda and open a blog post ----
- tapOn: "Beranda"

- scrollUntilVisible:
    element: "Artikel Terbaru"

- assertVisible: "Artikel Terbaru"
- takeScreenshot: "09_blog_list_before_comment"

