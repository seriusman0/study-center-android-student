appId: com.studycenter.sc_student
---
# Flow 09: Komentar — read comments on a blog post, post a comment
# Covers: GET /api/blogs/{blog}/comments, POST /api/blogs/{blog}/comments,
#         DELETE /api/comments/{comment}
#
# Assumes a blog detail screen is accessible by tapping a blog card on Beranda.

- launchApp:
    clearState: true

# ---- Login ----
- assertVisible: "Masuk"
- tapOn: "Email"
- inputText: "test@studycenter.test"
- tapOn: "Password"
- inputText: "password123"
- tapOn:
    text: "Masuk"
    index: 0

- extendedWaitUntil:
    visible: "Beranda"
    timeout: 8000

# ---- Navigate to Beranda and open a blog post ----
- tapOn: "Beranda"
- waitForAnimationToEnd

- scrollUntilVisible:
    element: "Artikel Terbaru"
    direction: DOWN

- assertVisible: "Artikel Terbaru"
- takeScreenshot: "09_blog_list_before_comment"

# ---- Tap the first blog card to open detail ----
# Adjust element text to match a known blog title in test data
- tapOn:
    text: "Artikel Terbaru"
    index: 0

- waitForAnimationToEnd
- takeScreenshot: "09_blog_detail_open"

# ---- Test: Comment list is visible ----
- scrollUntilVisible:
    element: "Komentar"
    direction: DOWN

- assertVisible: "Komentar"
- takeScreenshot: "09_comment_list"

# ---- Test: Post a new comment ----
- scrollUntilVisible:
    element: "Tulis komentar..."
    direction: DOWN

- tapOn: "Tulis komentar..."
- inputText: "Terima kasih atas sharingnya, sangat bermanfaat!"
- hideKeyboard

- tapOn: "Kirim"

- extendedWaitUntil:
    visible: "Terima kasih atas sharingnya, sangat bermanfaat!"
    timeout: 5000

- takeScreenshot: "09_comment_posted"

# ---- Test: Delete own comment ----
- tapOn: "Hapus"

- assertNotVisible: "Terima kasih atas sharingnya, sangat bermanfaat!"
- takeScreenshot: "09_comment_deleted"

- takeScreenshot: "09_komentar_flow_end"
