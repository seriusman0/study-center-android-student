# the steps above are commented out as specifications for when they are built.
# The API contract below is what the backend currently supports.

- takeScreenshot: "09_komentar_flow_end"

# ---- API contract notes ----
# GET /api/blogs/{blog}/comments (public, no auth)
#   Returns: array of comment objects with user info
#   { id, blog_id, user_id, body, created_at, user: { id, name, username, avatar } }
#
# POST /api/blogs/{blog}/comments (auth required, any role)
#   Rate limit: 20 requests/minute
#   Body: { body: "comment text" }
#   Returns 201 with created comment
#
# DELETE /api/comments/{comment} (auth required, must be comment author or admin)
#   Returns 200: { "message": "Comment deleted." }
