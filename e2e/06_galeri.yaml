appId: com.studycenter.sc_student
---
# Flow 06: Galeri — view photo gallery from student's cabang
# Covers: GET /api/galeri
#
# The gallery is displayed on the Home (Beranda) screen under "Galeri Kegiatan"
# as a horizontal scrollable list of photo cards.

- launchApp:
    clearState: true

# ---- Login ----
- assertVisible: "Masuk"
- tapOn: "Email"
- inputText: "test@studycenter.test"
- tapOn: "Password"
- inputText: "password123"
- tapOn:
    text: "Masuk"
    index: 0

- extendedWaitUntil:
    visible: "Beranda"
    timeout: 8000

# ---- Ensure we are on Beranda tab ----
- tapOn: "Beranda"
- waitForAnimationToEnd

# ---- Scroll to gallery section ----
- scrollUntilVisible:
    element: "Galeri Kegiatan"
    direction: DOWN

- assertVisible: "Galeri Kegiatan"
- takeScreenshot: "06_galeri_section_visible"

- takeScreenshot: "06_galeri_content"

# ---- Test: Scroll horizontally through gallery photos ----
- swipe:
    direction: LEFT
    duration: 300

- takeScreenshot: "06_galeri_scrolled_right"

# ---- Test: Pull to refresh home screen ----
- swipe:
    direction: DOWN
    duration: 300

- extendedWaitUntil:
    visible: "Beranda"
    timeout: 5000

- scrollUntilVisible:
    element: "Galeri Kegiatan"
    direction: DOWN

- assertVisible: "Galeri Kegiatan"
- takeScreenshot: "06_galeri_after_refresh"
