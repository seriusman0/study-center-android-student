appId: com.studycenter.sc_student
---
# Flow 03: Jurnal today — view, check PL/PB, save verse, check life item
# Covers: GET /api/jurnal/today, POST /api/jurnal/check (pl, pb, verse, life)

- launchApp:
    clearState: true

# ---- Login first ----
- assertVisible: "Masuk"
- tapOn: "email@contoh.com / username"
- eraseText
- inputText: "test@studycenter.test"
- tapOn: "Masukkan password"
- eraseText
- inputText: "password123"
- hideKeyboard
- tapOn: "Login Sekarang"

- extendedWaitUntil:
    visible: "Beranda"
    timeout: 8000

# ---- Navigate to Jurnal tab ----
- tapOn: "Jurnal"
- waitForAnimationToEnd

- assertVisible: "Jurnal Harian"
- takeScreenshot: "03_jurnal_screen_initial"

# ---- Verify key sections are visible ----
- assertVisible: "Perjanjian Lama"
- assertVisible: "Perjanjian Baru"
- assertVisible: "Hafal Ayat"

- takeScreenshot: "03_jurnal_bible_section"

# ---- Test: Check PL (Perjanjian Lama) ----
- tapOn: "Perjanjian Lama"
- waitForAnimationToEnd
- takeScreenshot: "03_jurnal_pl_checked"

# ---- Test: Check PB (Perjanjian Baru) ----
- tapOn: "Perjanjian Baru"
- waitForAnimationToEnd
- takeScreenshot: "03_jurnal_pb_checked"

# ---- Test: Uncheck PL ----
- tapOn: "Perjanjian Lama"
- waitForAnimationToEnd
- takeScreenshot: "03_jurnal_pl_unchecked"

# ---- Test: Ayat Hafalan section ----
- scrollUntilVisible:
    element: "Hafal Ayat"
    direction: DOWN

- assertVisible: "Hafal Ayat"
- takeScreenshot: "03_jurnal_verse_section"

# ---- Test: Check a life item ----
- scrollUntilVisible:
    element: "Jadwal Kehidupan"
    direction: DOWN

- assertVisible: "Jadwal Kehidupan"
- takeScreenshot: "03_jurnal_life_section"

# Tap the first visible life item (default seeded label — see
# docs/android-api-reference.md § JurnalLifeItem defaults)
- scrollUntilVisible:
    element: "Mengawali hari dengan berdoa"
    direction: DOWN

- tapOn: "Mengawali hari dengan berdoa"
- waitForAnimationToEnd
- takeScreenshot: "03_jurnal_life_item_checked"

# Uncheck the same item
- tapOn: "Mengawali hari dengan berdoa"
- waitForAnimationToEnd
- takeScreenshot: "03_jurnal_life_item_unchecked"

# ---- Test: Pull-to-refresh ----
- swipe:
    direction: DOWN
    duration: 300

- extendedWaitUntil:
    visible: "Jurnal Harian"
    timeout: 5000

- takeScreenshot: "03_jurnal_after_refresh"
