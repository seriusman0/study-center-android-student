appId: com.studycenter.sc_student
---
# Quick role rotation test: login 7 roles sequentially, take screenshot each.
# Each role: clearState → login → wait home → screenshot → next.

# ── 1. ADMIN ──
- launchApp:
    clearState: true
- tapOn: "email@contoh.com / username"
- eraseText
- waitForAnimationToEnd:
    timeout: 500
- inputText: "test_admin@studycenter.test"
- tapOn: "Masukkan password"
- eraseText
- waitForAnimationToEnd:
    timeout: 500
- inputText: "Test12345"
- hideKeyboard
- tapOn: "Login Sekarang"
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: "Test Admin"
    timeout: 15000
- takeScreenshot: "role_01_admin"

