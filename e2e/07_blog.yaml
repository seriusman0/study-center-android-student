appId: com.studycenter.sc_student
---
# Flow 07: Blog — view list and detail
# Covers: GET /api/blogs, GET /api/blogs/{slug}
#
# Blog list is shown on the Home (Beranda) screen under "Artikel Terbaru".

- launchApp:
    clearState: true

# ---- Login ----
- assertVisible: "Masuk"
- tapOn: "email@contoh.com / username"
- eraseText
- inputText: "test@studycenter.test"
- tapOn: "Masukkan password"
- eraseText
- inputText: "password123"
- hideKeyboard
- tapOn: "Login Sekarang"

- extendedWaitUntil:
    visible: "Beranda"
    timeout: 8000

# ---- Navigate to Beranda tab ----
- tapOn: "Beranda"
- waitForAnimationToEnd

- takeScreenshot: "07_beranda_home"

# ---- Test: Blog list visible on home screen ----
- scrollUntilVisible:
    element: "Artikel Terbaru"
    direction: DOWN

- assertVisible: "Artikel Terbaru"
- takeScreenshot: "07_blog_list_section"

- takeScreenshot: "07_blog_list_content"

# ---- Test: Pull to refresh home screen ----
- swipe:
    direction: DOWN
    duration: 300

- extendedWaitUntil:
    visible: "Beranda"
    timeout: 5000

- scrollUntilVisible:
    element: "Artikel Terbaru"
    direction: DOWN

- assertVisible: "Artikel Terbaru"
- takeScreenshot: "07_blog_after_refresh"
