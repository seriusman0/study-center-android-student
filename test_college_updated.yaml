appId: com.studycenter.sc_student
---
- launchApp:
    clearState: true
- assertVisible: "Masuk"
- tapOn: "email@contoh.com / username"
- inputText: "karuniaplus"
- tapOn: "Masukkan password"
- inputText: "12345"
- pressKey: Enter
- tapOn: "Login Sekarang"
- waitForAnimationToEnd: 
    timeout: 3000
- assertVisible: ".*QR Absensi.*"
- takeScreenshot: "college_beranda_fixed"
- tapOn: "Jurnal"
- waitForAnimationToEnd: 
    timeout: 3000
- assertVisible: ".*Pembacaan Alkitab.*"
- takeScreenshot: "college_jurnal_fixed"
